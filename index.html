<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CMMS บันทึกถอดอะไหล่ Inactive</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; font-family: 'Prompt', sans-serif; }
    body { background: #0f172a; color: #f8fafc; margin: 0; padding: 12px; }
    .card { background: #1e293b; border-radius: 16px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); max-width: 480px; margin: auto; border: 1px solid #334155; }
    .header { text-align: center; margin-bottom: 18px; }
    .header h3 { margin: 0; color: #38bdf8; font-size: 19px; font-weight: 700; }
    .header p { margin: 4px 0 0; color: #94a3b8; font-size: 12px; }
    .badge-donor { display: inline-block; background: #0369a1; color: #ffffff; padding: 5px 14px; border-radius: 20px; font-weight: 600; font-size: 14px; margin-top: 10px; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #cbd5e1; margin-bottom: 5px; }
    select, input { width: 100%; padding: 11px 13px; background: #0f172a; border: 1.5px solid #334155; border-radius: 10px; color: #ffffff; font-size: 14px; outline: none; transition: 0.2s; }
    select:focus, input:focus { border-color: #38bdf8; background: #1e293b; }
    
    /* กล่องแสดงรูปตัวอย่างอะไหล่ */
    .part-preview-box { display: none; margin-top: 10px; padding: 12px; background: #0f172a; border-radius: 12px; border: 1.5px solid #0284c7; text-align: center; }
    .part-preview-img { max-width: 100%; max-height: 200px; border-radius: 8px; object-fit: contain; background: white; padding: 4px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    .part-preview-desc { font-size: 13px; color: #38bdf8; font-weight: 700; margin-top: 8px; }

    .btn { width: 100%; background: #0284c7; color: white; border: none; padding: 13px; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 12px; }
    .btn:active { background: #0369a1; }
    .btn:disabled { background: #475569; cursor: not-allowed; }
    .success-box { display: none; text-align: center; padding: 25px 15px; background: #064e3b; border-radius: 12px; color: #6ee7b7; border: 1px solid #059669; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <h3>📋 แบบบันทึกถอดอะไหล่ Inactive</h3>
      <p>CMMS Maintenance Machine Part Salvage</p>
      <div class="badge-donor" id="donorBadge">กำลังโหลด...</div>
    </div>

    <div id="successBox" class="success-box">
      <h3 style="margin-top:0; color:#34d399;">✅ บันทึกข้อมูลสำเร็จ!</h3>
      <p style="font-size: 13px; color:#a7f3d0;">บันทึกรายการขึ้น Google Sheet เรียบร้อยแล้ว</p>
      <button class="btn" style="background:#059669;" onclick="location.reload()">+ บันทึกเพิ่มอีกชิ้น</button>
    </div>

    <form id="salvageForm">
      <!-- 1. เครื่องจักรต้นทาง Dropdown -->
      <div class="form-group">
        <label>📍 1. เครื่องจักรต้นทางที่ถูกถอด (Donor Machine) *</label>
        <select id="donorMachine" required onchange="onDonorChange()"></select>
      </div>

      <!-- 2. อะไหล่ที่ถอด Dropdown + รูปตัวอย่าง -->
      <div class="form-group">
        <label>🔧 2. รหัสและชื่ออะไหล่ที่ถอด (Part Catalogue) *</label>
        <select id="partSelect" required onchange="onPartChange()"></select>

        <!-- กล่องแสดงรูปอะไหล่ -->
        <div id="partPreviewBox" class="part-preview-box">
          <img id="partPreviewImg" class="part-preview-img" src="" alt="Part Preview">
          <div id="partPreviewDesc" class="part-preview-desc"></div>
        </div>
      </div>

      <!-- 3. จำนวนที่ถอด Dropdown -->
      <div class="form-group">
        <label>🔢 3. จำนวนที่ถอด (Qty) *</label>
        <select id="qty" required>
          <option value="1">1 ชิ้น (PCS)</option>
          <option value="2">2 ชิ้น (PCS)</option>
          <option value="3">3 ชิ้น (PCS)</option>
          <option value="4">4 ชิ้น (PCS)</option>
          <option value="5">5 ชิ้น (PCS)</option>
          <option value="10">10 ชิ้น (PCS)</option>
        </select>
      </div>

      <!-- 4. นำไปใช้งานที่ไหน Dropdown -->
      <div class="form-group">
        <label>🎯 4. นำไปใช้งานที่ไหน (Destination) *</label>
        <select id="destinationType" onchange="toggleDestination()">
          <option value="INSTALL">ใส่เครื่องจักรใช้งานทันที (Active Machine)</option>
          <option value="CABINET">เก็บเข้าตู้ Stock / ตู้สแปร์ (Spare Cabinet)</option>
        </select>
      </div>

      <!-- เครื่องปลายทาง Dropdown -->
      <div class="form-group" id="targetMachineGroup">
        <label>เครื่องจักรปลายทาง (Target Machine)</label>
        <select id="targetMachine"></select>
      </div>

      <!-- เลขที่ใบงานซ่อม (WO No.) -->
      <div class="form-group" id="targetWoGroup">
        <label>เลขที่ใบงานซ่อม (WO No. / BMM No.)</label>
        <input type="text" id="targetWo" placeholder="เช่น BMM26-XXXX หรือ WO26XXXX">
      </div>

      <!-- ตู้จัดเก็บ Dropdown -->
      <div class="form-group" id="cabinetLocationGroup" style="display:none;">
        <label>เลือกตู้จัดเก็บ (Cabinet Location)</label>
        <select id="cabinetLocation">
          <option value="ตู้ Spare A (RX1)">ตู้ Spare A (RX1)</option>
          <option value="ตู้ Spare B (RX1)">ตู้ Spare B (RX1)</option>
          <option value="ตู้ Spare Main (RX2)">ตู้ Spare Main (RX2)</option>
          <option value="ตู้ชั้นวางอะไหล่ถอดรอตรวจ">ตู้ชั้นวางอะไหล่ถอดรอตรวจ</option>
        </select>
      </div>

      <!-- 5. ช่างผู้ถอด Dropdown (แยกหมวดหมู่) -->
      <div class="form-group">
        <label>👤 5. ช่างผู้ถอดอะไหล่ (Technician) *</label>
        <select id="technicianName" required></select>
      </div>

      <button type="submit" class="btn" id="btnSubmit">💾 บันทึกข้อมูลขึ้นระบบ</button>
    </form>
  </div>

  <script>
    // 1. รายชื่อ 34 เครื่อง Inactive
    var donorMachines = [
      'RX1-CG-SF-10', 'RX1-CG-SF-11', 'RX1-CG-SF-12', 'RX1-CG-SF-13', 'RX1-CG-SF-14',
      'RX1-CG-SF-15', 'RX1-CG-SF-18', 'RX1-CG-SF-36', 'RX1-CG-SF-37', 'RX1-CG-SF-38',
      'RX1-CG-SF-41', 'RX1-CG-SF-42', 'RX1-CG-SF-44', 'RX1-CG-SF-45', 'RX1-CG-SF-46',
      'RX1-CG-SF-55', 'RX1-CG-SF-56', 'RX1-CG-SF-62T', 'RX1-MBLOCK-SF-06', 'RX1-MBLOCK-SF-07',
      'RX1-MBLOCK-SF-08', 'RX1-MBLOCK-SF-09', 'RX1-MBLOCK-SF-18', 'RX2-ARC100-SF-01',
      'RX2-ARC100-SF-02', 'RX2-ARC100-SF-03', 'RX2-ARC100-SF-04', 'RX2-CG-SF-34',
      'RX2-PMD.MODULO-SF-01', 'RX2-PMD.MODULO-SF-02', 'RX2-PMP-SF-01', 'RX2-PMP-SF-02',
      'RX2-PMP-SF-06', 'RXE-ABLOCK-SF-01'
    ];

    // 2. ฐานข้อมูลอะไหล่พบบ่อย พร้อมรูปถ่ายจริง
    var partsList = [
      { cat: "SF.CG-CS-VFT-004", name: "COLLET CHUCK 12 LEAF STD FOR VFT", img: "https://raw.githubusercontent.com/Monkii-D-Luffy/part-salvage/main/images/SF.CG-CS-VFT-004.jpg" },
      { cat: "SF.CG-CS-VFT-002", name: "COLLET CHUCK 12 LEAF CARBIDE FOR VFT", img: "https://raw.githubusercontent.com/Monkii-D-Luffy/part-salvage/main/images/SF.CG-CS-VFT-002.jpg" },
      { cat: "SF.CG-CS-VFT-001", name: "CHUCK BODY VFT-ORBIT", img: "https://raw.githubusercontent.com/Monkii-D-Luffy/part-salvage/main/images/SF.CG-CS-VFT-001.jpg" },
      { cat: "SF.CG-TOOL-001", name: "MILLING TOOL PCD D60", img: "https://raw.githubusercontent.com/Monkii-D-Luffy/part-salvage/main/images/SF.CG-TOOL-001.jpg" },
      { cat: "SF.MB-VALVE-001", name: "SOLENOID VALVE 5/2 WAY SMC", img: "https://raw.githubusercontent.com/Monkii-D-Luffy/part-salvage/main/images/SF.MB-VALVE-001.jpg" },
      { cat: "SF.MB-CYL-002", name: "CLAMPING CYLINDER FESTO", img: "https://raw.githubusercontent.com/Monkii-D-Luffy/part-salvage/main/images/SF.MB-CYL-002.jpg" },
      { cat: "SF.PMP-PAD-001", name: "POLISHING PAD CARRIER CCP", img: "https://raw.githubusercontent.com/Monkii-D-Luffy/part-salvage/main/images/SF.PMP-PAD-001.jpg" },
      { cat: "SF.GEN-SENSOR-001", name: "PROXIMITY SENSOR OMRON", img: "https://raw.githubusercontent.com/Monkii-D-Luffy/part-salvage/main/images/SF.GEN-SENSOR-001.jpg" },
      { cat: "OTHER-PART", name: "อะไหล่อื่นๆ (ระบุในหมายเหตุ)", img: "" }
    ];

    // 3. รายชื่อเครื่อง Active ปลายทาง
    var targetMachines = [
      'RX1-CG-SF-01', 'RX1-CG-SF-02', 'RX1-CG-SF-03', 'RX1-CG-SF-04', 'RX1-CG-SF-05',
      'RX1-CG-SF-06', 'RX1-CG-SF-07', 'RX1-CG-SF-08', 'RX1-CG-SF-09', 'RX1-CG-SF-16',
      'RX1-CG-SF-17', 'RX1-CG-SF-19', 'RX1-CG-SF-20', 'RX1-MBLOCK-SF-01', 'RX1-MBLOCK-SF-02',
      'RX1-MBLOCK-SF-03', 'RX1-MBLOCK-SF-04', 'RX1-MBLOCK-SF-05', 'RX2-CG-SF-21',
      'RX2-CG-SF-22', 'RX2-CG-SF-23', 'RX2-ARC100-SF-05', 'RX2-PMP-SF-03', 'RX2-PMP-SF-04',
      'เครื่องอื่นๆ (ระบุใน WO)'
    ];

    // 4. รายชื่อช่างจัดกลุ่มตามแผนก
    var technicianGroups = {
      "Site: RX1-Surface": [
        "BUNTAN MANJIT", "CHAIPICHIT LEUSAN", "CHATREE CHANKASEM", "CHUKIAT PIKULKAW", "KITTISAK TAWEE", "SOMCHAI JAIDEE", "NANTASIT KAEWMEESEE"
      ],
      "Site: RX2-Surface": [
        "AMARIN SRIPARN", "CHARIN PUEK-NGAM", "CHATCHAWAN PUNYARAT", "DAW WANNAKAN", "DOKRANG NOYNA"
      ],
      "Site: RX3-Surface": [
        "ADISORN JIT-AKA", "EKKALUCK WANGSEWKLANG", "PANJA PAKKOTANANG", "PONGSAK TIPPANAS", "PRASERT AEAMJIT"
      ],
      "แผนก TINT (รวมทุกโรงงาน)": [
        "CHAMNAN NANUDORN", "CHARAN THAPPAN", "NATTAPHON PHONHAN", "SURIYAPONG CHAIYA", "TOSSAPON WONGCHANTEUK"
      ],
      "แผนก HELP & FINAL (รวมทุกโรงงาน)": [
        "ANUCHIT YOLAO", "APISIT PRATUMWONG", "APIWATT PRABUNREUNG", "NOPPON HOMSUK", "PAPHAWIN CHUAPHEANG", "KITTI SOMSRI"
      ]
    };

    var urlParams = new URLSearchParams(window.location.search);
    var preselectedDonor = urlParams.get('donor') || '';

    // สร้าง Dropdown เครื่องต้นทาง
    var selD = document.getElementById('donorMachine');
    selD.innerHTML = '<option value="">-- เลือกเครื่องต้นทาง --</option>';
    donorMachines.forEach(function(m) {
      var opt = document.createElement('option');
      opt.value = m; opt.text = m;
      if (m === preselectedDonor) opt.selected = true;
      selD.appendChild(opt);
    });
    onDonorChange();

    function onDonorChange() {
      var val = selD.value || preselectedDonor;
      document.getElementById('donorBadge').innerText = val ? ("เครื่อง: " + val) : "กรุณาเลือกเครื่อง";
    }

    // สร้าง Dropdown อะไหล่
    var selP = document.getElementById('partSelect');
    selP.innerHTML = '<option value="">-- แตะเลือกอะไหล่ที่ถอด --</option>';
    partsList.forEach(function(p, idx) {
      var opt = document.createElement('option');
      opt.value = idx;
      opt.text = p.cat + " : " + p.name;
      selP.appendChild(opt);
    });

    // เมื่อเลือกอะไหล่ -> เด้งรูปภาพขึ้นมาให้ดูทันที
    function onPartChange() {
      var idx = selP.value;
      var previewBox = document.getElementById('partPreviewBox');
      var previewImg = document.getElementById('partPreviewImg');
      var previewDesc = document.getElementById('partPreviewDesc');

      if (idx !== "" && partsList[idx]) {
        var p = partsList[idx];
        previewDesc.innerText = p.cat + " — " + p.name;
        previewImg.src = p.img || ("https://dummyimage.com/300x180/0f172a/38bdf8.png&text=" + encodeURIComponent(p.cat));
        previewBox.style.display = 'block';
      } else {
        previewBox.style.display = 'none';
      }
    }

    // สร้าง Dropdown เครื่องปลายทาง
    var selTM = document.getElementById('targetMachine');
    selTM.innerHTML = '<option value="">-- เลือกเครื่องปลายทาง --</option>';
    targetMachines.forEach(function(m) {
      var opt = document.createElement('option');
      opt.value = m; opt.text = m;
      selTM.appendChild(opt);
    });

    // สร้าง Dropdown ช่าง
    var selT = document.getElementById('technicianName');
    selT.innerHTML = '<option value="">-- เลือกชื่อช่างผู้ถอด --</option>';
    for (var group in technicianGroups) {
      var optGroup = document.createElement('optgroup');
      optGroup.label = "🏢 " + group;
      technicianGroups[group].forEach(function(name) {
        var opt = document.createElement('option');
        opt.value = name; opt.text = "👤 " + name;
        optGroup.appendChild(opt);
      });
      selT.appendChild(optGroup);
    }

    function toggleDestination() {
      var type = document.getElementById('destinationType').value;
      document.getElementById('targetMachineGroup').style.display = type === 'CABINET' ? 'none' : 'block';
      document.getElementById('targetWoGroup').style.display = type === 'CABINET' ? 'none' : 'block';
      document.getElementById('cabinetLocationGroup').style.display = type === 'CABINET' ? 'block' : 'none';
    }

    // บันทึกข้อมูล
    document.getElementById('salvageForm').addEventListener('submit', function(e) {
      e.preventDefault();
      var btn = document.getElementById('btnSubmit');
      btn.disabled = true;
      btn.innerText = '⏳ กำลังบันทึกข้อมูล...';

      var partIdx = document.getElementById('partSelect').value;
      var selectedPart = partsList[partIdx] || { cat: "-", name: "-" };

      var data = {
        donorMachine: document.getElementById('donorMachine').value,
        catalogueNo: selectedPart.cat,
        partName: selectedPart.name,
        qty: document.getElementById('qty').value,
        destinationType: document.getElementById('destinationType').value,
        targetMachine: document.getElementById('targetMachine').value,
        targetWo: document.getElementById('targetWo').value,
        cabinetLocation: document.getElementById('cabinetLocation').value,
        technicianName: document.getElementById('technicianName').value
      };

      var scriptUrl = "https://script.google.com/macros/s/AKfycby1hBdguY0mGtpsUvoxt2DaJHx4eH6hiZFsbBOfrxKmzqDCHKs8e_DBiyuVvc_BIstg/exec";

      fetch(scriptUrl, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      }).then(function() {
        document.getElementById('salvageForm').style.display = 'none';
        document.getElementById('successBox').style.display = 'block';
      }).catch(function(err) {
        alert("เกิดข้อผิดพลาดในการส่งข้อมูล: " + err);
        btn.disabled = false;
        btn.innerText = '💾 บันทึกข้อมูลขึ้นระบบ';
      });
    });
  </script>
</body>
</html>
